<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My College ID Card</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="card-container">
      <div class="id-card">
      <header class="card-header">
        <img src="images/logo.jpeg" class="logo">
        <p>PRAGNYA DEGREE COLLEGE</p>
        <p>(Affiliated to Osmania University)</p>
    </header>      
    <div class="photo-wrap">
        <img src="images/myphoto.png" alt="Profile Photo" class="photo">
      </div>  
        <main class="card-body">
          <div class="section">
            <h2 class="student-name">Hafeeza Iqra Mohammadi</h2>
            <p class="college" >Pragnya Degree College </p>
          </div> 
           <hr class="divider">
       <div class="details">
         <p><strong>Course:</strong>BCA</p>
         <p><strong>BirthDate:</strong>23-03-2007</p>
       </div>
       <div class="id-line">
         <span class="id-label">ID No.:</span>
         <span class="id-value">124124861017</span>
       </div>
       <div class="barcode"></div>
       <footer class="card-footer">
         <p class="footer-text">
           Issued by: Pragnya Degree College 
         </p>
       </footer>   
        </main>
         </div>
      </div>

    
</body>
</html>
